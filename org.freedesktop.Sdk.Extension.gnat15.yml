id: org.freedesktop.Sdk.Extension.gnat15
branch: '25.08'
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false
modules:
  - name: gnat
    buildsystem: simple
    build-commands:
      - cp -a . "${FLATPAK_DEST}/"
    sources:
      - only-arches:
          - aarch64
        type: archive
        url: https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnat-15.2.0-1/gnat-aarch64-linux-15.2.0-1.tar.gz
        sha256: 058fc2ee214952dc14c0ae7b0fb932e0afcd09854822ce806e3436bfb9547cbb
      - only-arches:
          - x86_64
        type: archive
        url: https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnat-15.2.0-1/gnat-x86_64-linux-15.2.0-1.tar.gz
        sha256: 4640d4b369833947ab1a156753f4db0ecd44b0f14410b5b2bc2a14df496604bb

  - name: gnatprove
    buildsystem: simple
    build-commands:
      - cp -a . "${FLATPAK_DEST}/"
    sources:
      - only-arches:
          - aarch64
        type: archive
        url: https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnatprove-15.1.0-1/gnatprove-aarch64-linux-15.1.0-1.tar.gz
        sha256: 5131b7ccf04bb2c4ed12bd3e65ad92889f48ff1fabab257c6fa8407f067db7de

      - only-arches:
          - x86_64
        type: archive
        url: https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnatprove-15.1.0-1/gnatprove-x86_64-linux-15.1.0-1.tar.gz
        sha256: aad9a73f600d3008f33141a6cd4c5314d4c210e8928edc172c23c76104ddf7b2

  - name: gprbuild
    buildsystem: simple
    build-commands:
      - cp -a . "${FLATPAK_DEST}/"
    sources:
      - only-arches:
          - aarch64
        type: archive
        url: https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnatcov-26.2-1/gnatcov-aarch64-linux-26.2-1.tar.gz
        sha256: b465e28dd75ffba01737a923975ebc3d85468826492f1c62783d4c81c5fe36db

      - only-arches:
          - x86_64
        type: archive
        url: https://github.com/alire-project/GNAT-FSF-builds/releases/download/gprbuild-25.0.0-1/gprbuild-x86_64-linux-25.0.0-1.tar.gz
        sha256: 9a2e6cfb9c4add85c7c411e95533c46728aae7de19a9a0b056abf53bd9795b0d

  - name: alire
    buildsystem: simple
    build-commands:
      - install -Dm755 -t "${FLATPAK_DEST}/bin" alr
    sources:
      - only-arches:
          - aarch64
        type: archive
        url: https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-aarch64-linux.zip
        sha256: d76c93ad3dc631826144e10bdabc6b3bf98783805bebfd5e4a0e852dd524d812

      - only-arches:
          - x86_64
        type: archive
        url: https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
        sha256: 09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7

  - name: enable-sh
    buildsystem: simple
    build-commands:
      - install -Dm755 -t "${FLATPAK_DEST}" enable.sh
    sources:
      - type: file
        path: enable.sh.in
      - type: shell
        commands:
          - sed -e "s,@FLATPAK_DEST@,${FLATPAK_DEST},g" < enable.sh.in > enable.sh

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 -t "${FLATPAK_DEST}/share/metainfo" org.freedesktop.Sdk.Extension.gnat15.metainfo.xml
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.gnat15.metainfo.xml
